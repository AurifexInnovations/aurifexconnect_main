spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:D:/aurifex_innovation/project/auri_connect/ERP.DB

  jpa:
    database-platform: com.erp.config.SQLiteDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        enable_lazy_load_no_trans: true
        connection.provider_disables_autocommit: true
        connection.isolation: 2  # ignored in SQLite

  flyway:
    enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_MAIL}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  jackson:
    date-format: dd-MM-yyyy hh:mm:ss a
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false

root:
  email: ${ROOT_EMAIL}
  password: ${ROOT_PASSWORD}
  name: ${ROOT_NAME}

app:
  base-url: /api/v1
  security:
    secret: ${SECURITY_SECRET}
    token-validity:
      access-validity: 3600
      refresh-validity: 1296000
  domain:
    name: ${DOMAIN_NAME}
    secure: ${DOMAIN_SECURE}
    same-site: ${DOMAIN_SAME_SITE}

logging:
  level:
    com.erp: DEBUG
    org:
      springframework.security: DEBUG
      hibernate.SQL: DEBUG
      hibernate.type.descriptor.sql.BasicBinder: TRACE
      hibernate.orm.jdbc.bind: TRACE