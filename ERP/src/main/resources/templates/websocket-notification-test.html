<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ERP WebSocket Notification Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; }
        .message { border-bottom: 1px solid #ddd; padding: 5px; }
        .private { color: blue; }
        .attendance { color: green; }
        .auth { color: purple; }
        .bank { color: brown; }
        .branch { color: orange; }
    </style>
</head>
<body>
<h2>ERP WebSocket Notification Test</h2>
<div id="messages"></div>

<script>
    let socket = new SockJS('http://localhost:8080/ws'); // change port if backend uses a different port
    let stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        console.log('Connected: ' + frame);

        // Subscribe to global topic
        stompClient.subscribe('/topic/global', function (notification) {
            displayMessage(notification, 'Global');
        });

        // Subscribe to private queue
        stompClient.subscribe('/user/queue/notifications', function (notification) {
            displayMessage(notification, 'Private', 'private');
        });

        // Subscribe to module-specific topics
        stompClient.subscribe('/topic/attendance', function (notification) {
            displayMessage(notification, 'Attendance', 'attendance');
        });

        stompClient.subscribe('/topic/auth', function (notification) {
            displayMessage(notification, 'Auth', 'auth');
        });

        stompClient.subscribe('/topic/bank', function (notification) {
            displayMessage(notification, 'Bank Account', 'bank');
        });

        stompClient.subscribe('/topic/branch', function (notification) {
            displayMessage(notification, 'Branch', 'branch');
        });
    });

    function displayMessage(notification, label, cssClass = '') {
        let msg = JSON.parse(notification.body);
        let div = document.createElement('div');
        div.className = `message ${cssClass}`;
        div.innerHTML = `<b>[${label}]</b> ${msg.title} - ${msg.message}`;
        document.getElementById("messages").appendChild(div);
    }
</script>
</body>
</html>
